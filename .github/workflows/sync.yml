name: Auto Sync Manga

on:
  schedule:
    - cron: '0 */3 * * *' # يعمل تلقائياً كل 3 ساعات
  workflow_dispatch:      # يتيح زر تشغيل يدوي متى ما أردت

jobs:
  update-manga:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libraries
        run: pip install -r requirements.txt

      - name: Run Sync Scripts
        run: |
          python sync.py
          python sync_ashiq.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "Auto update manga sources (Azora + Ashiq)" && git push)
