name: Auto Sync Manga

on:
  schedule:
    # ⏰ يعمل تلقائياً كل ساعة بالدقيقة 0
    - cron: '0 * * * *'
  
  # 🎯 تشغيل يدوي: يتيح اختيار تشغيل كافة السكربتات أو سكربت محدد
  workflow_dispatch:
    inputs:
      target_source:
        description: 'اختر المصدر المراد تحديثه:'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - azora
          - ashiq
          - despair
          - kolnovel

jobs:
  update-manga:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Libraries
        run: pip install -r requirements.txt

      # 🎯 عزل السكربتات: continue-on-error يضمن استمرار السيرفر حتى لو تعطل أحد المواقع
      - name: Sync Azora
        if: ${{ github.event_name == 'schedule' || inputs.target_source == 'all' || inputs.target_source == 'azora' }}
        continue-on-error: true
        run: python sync.py

      - name: Sync Ashiq
        if: ${{ github.event_name == 'schedule' || inputs.target_source == 'all' || inputs.target_source == 'ashiq' }}
        continue-on-error: true
        run: python sync_ashiq.py

      - name: Sync Despair
        if: ${{ github.event_name == 'schedule' || inputs.target_source == 'all' || inputs.target_source == 'despair' }}
        continue-on-error: true
        run: python sync_despair.py

      - name: Sync KolNovel
        if: ${{ github.event_name == 'schedule' || inputs.target_source == 'all' || inputs.target_source == 'kolnovel' }}
        continue-on-error: true
        run: python sync_kolnovel.py

      # 🎯 حفظ التعديلات ودفعها بأمان مع منع تشغيل Actions متداخلة عبر [skip ci]
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "Auto update: Active manga sources & new releases [skip ci]" && git pull --rebase && git push)
